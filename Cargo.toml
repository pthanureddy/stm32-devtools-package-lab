[package]
name = "stm32-devtools-package-lab"
version = "0.2.0"
edition = "2021"
description = "Rust and TypeScript developer tools for package manifests and deterministic distribution repacking"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
walkdir = "2.5"

