[package]
name = "stm32-devtools-package-lab"
version = "0.1.0"
edition = "2021"
description = "Rust and TypeScript developer-tools lab for STM32-style package manifests"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"

