name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked

  repack-e2e:
    name: Repack reproducibility and integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build deterministic fixture twice
        run: |
          cargo run --locked --quiet -- repack \
            --base examples/repack/base \
            --overlay examples/repack/overlay \
            --config examples/repack/product.yml \
            --output target/repack-a/product.tar.gz
          cargo run --locked --quiet -- repack \
            --base examples/repack/base \
            --overlay examples/repack/overlay \
            --config examples/repack/product.yml \
            --output target/repack-b/product.tar.gz
      - name: Compare reproducible outputs
        run: |
          cmp target/repack-a/product.tar.gz target/repack-b/product.tar.gz
          cmp target/repack-a/product.tar.gz.manifest.json target/repack-b/product.tar.gz.manifest.json
          sha256sum target/repack-a/product.tar.gz target/repack-a/product.tar.gz.manifest.json
      - name: Verify archive integrity and overlay precedence
        run: |
          python scripts/verify_repack.py \
            target/repack-a/product.tar.gz \
            target/repack-a/product.tar.gz.manifest.json \
            --base examples/repack/base \
            --overlay examples/repack/overlay

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high

